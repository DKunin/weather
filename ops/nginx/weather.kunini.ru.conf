server {
    listen 80;
    listen [::]:80;
    server_name weather.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/weather/dist;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name weather.kunini.ru;

    ssl_certificate /home/dekunin/letsencrypt/live/weather.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/weather.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
    }
}

